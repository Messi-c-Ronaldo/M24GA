<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>DynamicAiFeed</title></head>
<body>
<!-- 로더가 테마 CSS와 m24.call()/m24.toast()를 앞에 넣어 준다. 이 창은 sandbox iframe 안에서 돌고, 모드 Python의 ui_<이름>()만 부를 수 있다. -->
<div class="stats">
  <div class="stat"><div class="label">만든 댓글</div><div class="value" id="vMade">0</div></div>
  <div class="stat"><div class="label">이번 비용</div><div class="value" id="vCost">$0</div></div>
  <div class="stat tap" id="balBox"><div class="label">API 잔액 (눌러서 확인)</div><div class="value" id="vBal">-</div></div>
</div>

<div class="card">
  <div class="sec-title"><b>API 키</b><a id="keyState"></a></div>
  <div class="row col" style="padding:0">
    <div class="hint" id="keyHint" style="color:var(--text3);font-size:13px">키를 넣어 주세요 (DeepSeek 기본)</div>
    <div class="field">
      <input type="password" id="keyInput" placeholder="sk-..." autocomplete="off" spellcheck="false">
      <button class="btn primary" id="keySave">저장</button>
    </div>
  </div>
</div>

<div class="card">
  <div class="sec-title"><b>방금 만든 댓글</b><a id="cnt"></a></div>
  <div id="recent"><div class="empty">아직 만든 댓글이 없어요<br>소셜피드를 열어 보세요</div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const money = (v) => (v < 0.01 ? '$' + v.toFixed(4) : '$' + v.toFixed(2));
function cmt(c) {   // AI 문장은 textContent로만 넣는다
  const d = document.createElement('div'); d.className = 'cmt';
  const n = document.createElement('div'); n.className = 'new'; n.textContent = c.new;
  const m = document.createElement('div'); m.className = 'meta';
  if (c.body) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = '기사 참고'; m.appendChild(b); }
  m.appendChild(document.createTextNode(c.t + ' · ' + (c.parent || '글 없음')));
  m.appendChild(document.createElement('br'));
  m.appendChild(document.createTextNode('원래: ' + c.old));
  d.appendChild(n); d.appendChild(m); return d;
}
async function tick() {
  try {
    const s = await m24.call('state');
    $('vMade').textContent = s.made.toLocaleString() + (s.failed ? ' (실패 ' + s.failed + ')' : '');
    $('vCost').textContent = money(s.cost);
    $('keyState').textContent = s.keySet ? '저장됨' : '필요해요';
    $('keyHint').textContent = s.keySet ? '저장된 키가 있어요 · 바꾸려면 새 키를 넣어 주세요 · 모델 ' + s.model : '키를 넣어 주세요 (DeepSeek 기본)';
    const list = await m24.call('recent', 30);
    $('cnt').textContent = list.length ? list.length + '개' : '';
    if (list.length) $('recent').replaceChildren(...list.map(cmt));
  } catch (e) { /* 모드가 멈춘 동안은 조용히 넘긴다 */ }
}
async function balance(show) {
  $('vBal').textContent = '…';
  try {
    const r = await m24.call('test_api');
    if (r.ok && r.balance != null) { $('vBal').textContent = '$' + Number(r.balance).toFixed(2); if (show) m24.toast('연결됐어요 · 잔액 $' + r.balance); }
    else { $('vBal').textContent = '-'; if (show) m24.toast(r.ok ? (r.note || '연결됐어요') : r.error); }
  } catch (e) { $('vBal').textContent = '-'; if (show) m24.toast(e.message); }
}
$('balBox').addEventListener('click', () => balance(true));
$('keySave').addEventListener('click', async () => {
  try {
    const r = await m24.call('set_key', $('keyInput').value);
    if (!r.ok) return m24.toast(r.error);
    $('keyInput').value = ''; m24.toast('키를 저장했어요'); tick(); balance(true);
  } catch (e) { m24.toast(e.message); }
});
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
