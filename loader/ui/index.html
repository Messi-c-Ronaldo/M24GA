<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M24GA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="theme.css">
<style>
  body { overflow: hidden; }
  .shell { display: grid; grid-template-columns: 276px 1fr; height: 100%; }

  /* ---- 왼쪽: 모드 목록 ---- */
  .side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 22px 20px 14px; }
  .brand b { font-size: 22px; letter-spacing: -0.02em; }
  .brand span { display: block; color: var(--text3); font-size: 13px; margin-top: 2px; }
  .nav { flex: 1; overflow-y: auto; padding: 4px 10px; }
  .nav-label { color: var(--text3); font-size: 12px; font-weight: 600; margin: 16px 10px 6px; display: flex; justify-content: space-between; }
  .item { display: flex; align-items: center; gap: 10px; padding: 11px 10px; border-radius: 14px; cursor: pointer; margin-bottom: 2px; }
  .item:hover { background: var(--grey); }
  .item.sel { background: var(--card); }
  .item .ic { width: 34px; height: 34px; border-radius: 11px; background: var(--grey); color: var(--text2); display: flex; align-items: center; justify-content: center; flex: none; font-weight: 700; font-size: 15px; }
  .item.sel .ic { background: var(--blue-soft); color: var(--blue); }
  .item .tx { flex: 1; min-width: 0; }
  .item .nm { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .st { font-size: 12px; color: var(--text3); margin-top: 1px; display: flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--track-off); flex: none; }
  .dot.running { background: var(--blue); box-shadow: 0 0 8px rgba(49,130,246,.7); }
  .dot.ready { background: #7FB0F8; } .dot.build, .dot.safe, .dot.perm { background: var(--amber); } .dot.problem, .dot.error, .dot.auto_off { background: var(--red); }
  .side-foot { padding: 12px 14px 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; }
  .side-foot .wide1 { flex: 1 0 100%; }
  .btn.danger { background: var(--red-soft); color: #FF8B96; }
  .side-foot .btn { flex: 1; height: 40px; font-size: 13px; padding: 0 8px; }

  /* ---- 오른쪽 ---- */
  .main { overflow-y: auto; padding: 24px 28px 28px; min-width: 0; }
  .main .wrap { max-width: 720px; margin: 0 auto; }
  .page { display: none; } .page.active { display: block; }
  .hero { padding: 40px 20px 34px; }
  .note { background: var(--card); border-radius: 20px; padding: 16px 20px; color: var(--text2); font-size: 13.5px; line-height: 1.6; margin-bottom: 12px; }
  .note b { color: var(--text); }
  .alert { background: var(--red-soft); border-radius: 16px; padding: 12px 16px; color: #FF8B96; font-size: 13.5px; line-height: 1.5; margin-bottom: 8px; user-select: text; }
  .alert.amber { background: var(--amber-soft); color: var(--amber); }
  .alert.act { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .alert.act .btn { height: 36px; font-size: 13px; padding: 0 14px; flex: none; background: rgba(255,255,255,.12); color: inherit; }
  .safe-card { background: var(--amber-soft); border-radius: 20px; padding: 18px 20px; margin-bottom: 12px; color: var(--text); line-height: 1.55; font-size: 14px; }
  .safe-card b { color: var(--amber); font-size: 16px; display: block; margin-bottom: 4px; }
  .safe-card .btn { margin-top: 12px; height: 40px; font-size: 14px; background: var(--amber); color: #1c1c21; }

  /* 모드 머리 */
  .mhead { display: flex; align-items: center; gap: 16px; margin: 4px 4px 18px; }
  .mhead .ic { width: 54px; height: 54px; border-radius: 17px; background: var(--blue-soft); color: var(--blue); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; flex: none; }
  .mhead .tx { flex: 1; min-width: 0; }
  .mhead h1 { margin: 0 0 4px; font-size: 24px; }
  .mhead .meta { color: var(--text3); font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .mdesc { color: var(--text2); font-size: 15px; line-height: 1.55; margin: 0 4px 16px; }
  .tabs { display: flex; gap: 4px; background: var(--grey); border-radius: 14px; padding: 4px; margin-bottom: 16px; width: fit-content; }
  .tabs button { border: 0; background: transparent; padding: 9px 22px; border-radius: 11px; font: inherit; font-size: 14px; color: var(--text2); cursor: pointer; }
  .tabs button.sel { background: var(--sel); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px var(--shadow); }
  .tabs button:disabled { opacity: .35; cursor: default; }
  .tabs .cnt { display: inline-block; margin-left: 6px; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
  .logtools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .logtools .seg { margin: 0; width: 170px; } .logtools .seg button { padding: 7px 0; font-size: 13px; }
  .logtools .btn { height: 38px; font-size: 13px; padding: 0 14px; }
  .logtools .sp { flex: 1; }
  .logbox { background: var(--card); border-radius: 20px; padding: 12px 6px 12px 14px; height: calc(100vh - 330px); min-height: 280px; overflow-y: auto; font-family: Consolas, "Cascadia Mono", "D2Coding", monospace; font-size: 12.5px; line-height: 1.5; user-select: text; }
  .lg { display: flex; gap: 8px; padding: 2px 8px 2px 0; border-radius: 6px; }
  .lg .t { color: var(--text3); flex: none; } .lg .s { flex: none; align-self: flex-start; width: 34px; text-align: center; border-radius: 5px; font-size: 11px; line-height: 18px; background: var(--grey); color: var(--text2); }
  .lg .s.js { background: rgba(49,130,246,.18); color: #7FB0F8; } .lg .s.python { background: rgba(0,200,150,.15); color: #3DD6A8; }
  .lg .m { white-space: pre-wrap; word-break: break-word; min-width: 0; color: var(--text2); }
  .lg.warn .m { color: var(--amber); } .lg.error .m { color: #FF8B96; } .lg.error { background: rgba(240,68,82,.07); }
  .caps .row .l { min-width: 0; } .caps .tag { flex: none; font-size: 12px; padding: 3px 9px; border-radius: 8px; background: var(--grey); color: var(--text2); }
  .caps .tag.pc, .caps .tag.raw { background: var(--amber-soft); color: var(--amber); } .caps .tag.hook, .caps .tag.write { background: var(--red-soft); color: #FF8B96; }
  .caps .tag.need { outline: 1.5px solid currentColor; }
  .perm-card { background: var(--amber-soft); border-radius: 20px; padding: 16px 20px; margin-bottom: 12px; line-height: 1.55; font-size: 14px; }
  .perm-card b { color: var(--amber); display: block; margin-bottom: 4px; font-size: 15px; }
  .perm-card .btn { margin-top: 10px; height: 40px; font-size: 14px; background: var(--amber); color: #1c1c21; }
  .frame { width: 100%; border: 0; border-radius: 20px; background: transparent; height: calc(100vh - 268px); min-height: 360px; display: block; }
</style>
</head>
<body>
<div class="shell">

  <aside class="side">
    <div class="brand"><b>M24GA</b><span>FM24 모드 로더</span></div>
    <div class="nav">
      <div class="item sel" id="navHome" data-id="">
        <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 3 10.4V20a1 1 0 0 0 1 1h5.5v-6h5v6H20a1 1 0 0 0 1-1v-9.6z"/></svg></div>
        <div class="tx"><div class="nm">홈</div><div class="st"><span class="dot" id="homeDot"></span><span id="homeSt">꺼짐</span></div></div>
      </div>
      <div class="nav-label"><span>설치된 모드</span><span id="modCount"></span></div>
      <div id="modList"></div>
    </div>
    <div class="side-foot">
      <button class="btn wide1" id="btnInstall">모드 설치 (.24mod)</button>
      <button class="btn grey" id="btnFolder">모드 폴더 열기</button>
      <button class="btn grey" id="btnRescan">새로 고침</button>
    </div>
  </aside>

  <main class="main"><div class="wrap">

    <!-- 홈 -->
    <section class="page active" id="pg-home">
      <h1>M24GA</h1>
      <p class="sub">FM24에 모드를 붙이는 로더예요. 켜 두면 게임이 실행될 때 자동으로 연결돼요</p>
      <div class="card hero">
        <button class="big-toggle" id="bigToggle" aria-label="로더 켜기/끄기">
          <span class="knob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></span>
        </button>
        <div class="state-title" id="stTitle">M24GA 꺼짐</div>
        <div class="state-desc" id="stDesc">버튼을 누르면 켜져요</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="label">게임</div><div class="value" id="vGame">-</div></div>
        <div class="stat"><div class="label">켜진 모드</div><div class="value" id="vMods">0</div></div>
        <div class="stat"><div class="label">게임 데이터 표</div><div class="value" id="vMaps">-</div></div>
      </div>
      <div id="buildBox"></div>
      <div id="safeBox"></div>
      <div id="installFail"></div>
      <div id="alerts"></div>
      <div class="note"><b>모드는 믿을 수 있는 것만 넣으세요.</b> 모드는 게임 메모리와 이 PC에서 코드를 실행해요. 출처를 아는 모드 파일(.24mod)만 설치해 주세요.</div>
      <div class="foot" id="foot"></div>
    </section>

    <!-- 모드 -->
    <section class="page" id="pg-mod">
      <div class="mhead">
        <div class="ic" id="mIc"></div>
        <div class="tx"><h1 id="mName"></h1><div class="meta"><span id="mMeta"></span><span class="pill" id="mPill"></span></div></div>
        <label class="switch"><input type="checkbox" id="mSwitch"><span></span></label>
      </div>
      <p class="mdesc" id="mDesc"></p>
      <div class="tabs" id="mTabs">
        <button data-t="info">정보</button><button data-t="settings">설정</button><button data-t="window">모드창</button><button data-t="log">로그</button>
      </div>
      <div id="tab-info"></div>
      <div id="tab-settings"></div>
      <div id="tab-window"></div>
      <div id="tab-log"></div>
    </section>

  </div></main>
</div>
<div class="toast" id="toast"></div>

<script>
let api = null, S = null, busy = false;
let selId = '', tab = '', loaded = { id: null, tab: null }, curMod = null, frameId = null;
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {   // 모든 글자는 textContent로 넣는다 (모드가 낸 문자열이라도 HTML로 해석하지 않는다)
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v); }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }

const STATE_LABEL = { running: '실행 중', ready: '준비됨', off: '꺼짐', build: '빌드 불일치', problem: '켤 수 없음', error: '오류', auto_off: '자동으로 꺼짐', safe: '안전 모드', perm: '권한 필요' };
const STATE_SHORT = { running: '실행 중', ready: '켜짐 · 게임 대기', off: '꺼짐', build: '이 게임 빌드와 안 맞음', problem: '켤 수 없음', error: 'Python 오류', auto_off: '오류로 자동으로 꺼짐', safe: '안전 모드로 꺼 둠', perm: '권한을 허용해야 켜져요' };

// ---- 선택 ----
function select(id) {
  selId = id;
  $('pg-home').classList.toggle('active', !id);
  $('pg-mod').classList.toggle('active', !!id);
  if (id) { const m = modOf(id); tab = tab || defaultTab(m); showTab(tab, true); }
  render();
}
const modOf = (id) => (S ? S.mods.find((m) => m.id === id) : null);
const defaultTab = (m) => (m && m.state === 'perm' ? 'info' : m && (m.state === 'auto_off' || m.state === 'error') ? 'log' : (m && m.ui ? 'window' : (m && m.has_settings ? 'settings' : 'info')));
$('navHome').addEventListener('click', () => select(''));

// ---- 왼쪽 목록과 홈 (1초마다) ----
function renderSide() {
  $('homeDot').className = 'dot ' + (S.kind === 'on' ? 'running' : S.kind === 'error' ? 'error' : S.kind === 'off' ? '' : 'ready');
  $('homeSt').textContent = S.kind === 'on' ? '연결됨' : S.kind === 'off' ? '꺼짐' : S.title;
  $('navHome').classList.toggle('sel', !selId);
  $('modCount').textContent = S.mods.length ? S.mods.length + '개' : '';
  const box = $('modList');
  if (!S.mods.length) { box.replaceChildren(h('div', { class: 'empty' }, '설치된 모드가 없어요', h('br'), '아래 "모드 설치"로 .24mod 파일을 고르거나', h('br'), '모드 폴더에 넣고 새로 고침을 눌러 주세요')); return; }
  const sig = JSON.stringify(S.mods.map((m) => [m.id, m.state, m.enabled, m.name, m.version, m.id === selId]));
  if (box._sig === sig) return;      // 바뀐 게 없으면 다시 그리지 않는다 (누르는 중에 사라지지 않게)
  box._sig = sig;
  box.replaceChildren(...S.mods.map((m) => {
    const sw = h('input', { type: 'checkbox', checked: m.enabled, disabled: m.state === 'problem' });
    sw.addEventListener('click', (e) => e.stopPropagation());
    sw.addEventListener('change', () => setEnabled(m.id, sw.checked));
    const lab = h('label', { class: 'switch mini', onclick: (e) => e.stopPropagation() }, sw, h('span'));
    return h('div', { class: 'item' + (m.id === selId ? ' sel' : ''), onclick: () => { tab = ''; select(m.id); } },
      h('div', { class: 'ic' }, (m.name || m.id).slice(0, 1).toUpperCase()),
      h('div', { class: 'tx' }, h('div', { class: 'nm' }, m.name), h('div', { class: 'st' }, h('span', { class: 'dot ' + m.state }), STATE_SHORT[m.state] || m.state)),
      lab);
  }));
}
function renderHome() {
  const t = $('bigToggle'); t.className = 'big-toggle ' + (S.kind === 'off' ? '' : S.kind);
  if (!busy) { $('stTitle').textContent = S.title; $('stDesc').textContent = S.desc; }
  $('vGame').textContent = S.kind === 'off' ? '-' : (S.game ? (S.build ? '연결됨' : '확인 중') : '실행 안 됨');
  $('vGame').title = S.build || '';
  const on = S.mods.filter((m) => m.enabled && !m.problems.length).length;
  $('vMods').textContent = on + ' / ' + S.mods.length;
  $('vMaps').textContent = { ready: '준비됨', building: '만드는 중', wait: '대기' }[S.maps] || '-';
  $('foot').textContent = 'M24GA ' + S.version + (S.build ? ' · ' + S.build : '') + (S.game_date ? ' · 게임 날짜 ' + S.game_date : '') + (S.save_id ? ' · 세이브 ' + S.save_id : '');
  // 모르는 게임 빌드(Steam판 등): 진단 보고서 복사 (M48)
  const bb = $('buildBox'), bsig = S.kind === 'error' && S.title.indexOf('게임 버전') >= 0 ? '1' : '';
  if (bb.dataset.sig !== bsig) { bb.dataset.sig = bsig; bb.replaceChildren(); if (bsig) bb.append(h('div', { class: 'alert act' }, h('span', {}, '지원하지 않는 게임 빌드예요. 보고서에는 파일 크기·SHA-256·빌드 시각·서명 칸만 들어가고 개인 경로는 지워져요.'), h('button', { class: 'btn primary', onclick: async () => copyText(await api.get_build_report(), '빌드 진단 보고서를 복사했어요. 개발자에게 붙여 넣어 주세요') }, '빌드 진단 보고서 복사'))); }
  // 안전 모드 안내: 직전 게임이 모드가 올라간 채 튕겼을 때
  const sb = $('safeBox'), ssig = JSON.stringify(S.safe);
  if (sb._sig !== ssig) {
    sb._sig = ssig;
    sb.replaceChildren(...(S.safe ? [h('div', { class: 'safe-card' },
      h('b', {}, '안전 모드: 모드를 끈 채로 시작했어요'),
      '직전 게임이 비정상 종료돼서(종료 코드 ' + S.safe.code + ', ' + S.safe.time + ') 모드를 올리지 않았어요. 그때 올라가 있던 모드: ' + (S.safe.mods.join(', ') || '없음') + '. ',
      '모드가 원인인지 확인하려면 왼쪽 목록에서 모드를 하나씩 켜 보세요 (켠 모드만 올라가요). 문제가 없다고 생각하면 아래 버튼으로 모두 켜세요.',
      h('br'), h('button', { class: 'btn', onclick: async () => { await api.leave_safe_mode(); toast('안전 모드를 끝냈어요'); refresh(); } }, '안전 모드 끝내고 모드 모두 켜기'))] : []));
  }
  const al = [];
  const alertAct = (cls, text, label, fn) => h('div', { class: 'alert act ' + cls }, h('span', {}, text), h('button', { class: 'btn', onclick: fn }, label));
  S.errors.forEach(([p, e]) => al.push(h('div', { class: 'alert' }, '모드 파일 문제: ' + p.split(/[\\/]/).pop() + ' - ' + e)));
  S.mods.forEach((m) => {
    m.problems.forEach((p) => {
      if (p.startsWith('같은 id') && m.removable) al.push(alertAct('', m.name + ': ' + p + ' - 이 파일을 지우면 충돌이 풀려요', '이 파일 삭제', () => uninstall(m)));
      else al.push(h('div', { class: 'alert' }, m.name + ': ' + p));
    });
    if (m.auto_disabled) al.push(alertAct('', m.name + ': 오류가 반복돼서 자동으로 껐어요 (' + m.auto_disabled.time + ') - ' + m.auto_disabled.reason, '다시 켜기', () => setEnabled(m.id, true)));
    if (m.state === 'perm') al.push(alertAct('amber', m.name + ': 권한을 허용해야 켜져요 (' + m.needs_perm.join(', ') + ')', '권한 보기', () => { tab = 'info'; select(m.id); }));
    if (m.build_off) al.push(h('div', { class: 'alert amber' }, m.name + ': 이 게임 빌드에서 꺼 뒀어요 - ' + m.build_off));
    m.warnings.forEach((w) => al.push(h('div', { class: 'alert amber' }, m.name + ': ' + w)));
  });
  const box = $('alerts'), sig = al.map((a) => a.textContent).join('|');
  if (box._sig !== sig) { box._sig = sig; box.replaceChildren(...al); }
}
function renderModHead() {
  const m = modOf(selId); if (!m) { select(''); return; }
  $('mIc').textContent = (m.name || m.id).slice(0, 1).toUpperCase();
  $('mName').textContent = m.name;
  $('mMeta').textContent = 'v' + m.version + (m.author ? ' · ' + m.author : '');
  const p = $('mPill'); p.className = 'pill ' + m.state; p.textContent = STATE_LABEL[m.state] || m.state;
  $('mDesc').textContent = m.description || '';
  const sw = $('mSwitch'); sw.disabled = m.state === 'problem'; if (document.activeElement !== sw) sw.checked = m.enabled;
  const tb = $('mTabs').children;
  tb[1].disabled = !m.has_settings; tb[2].disabled = !m.ui;
  const cs = String(m.log_errors || 0);
  if (tb[3]._cs !== cs) { tb[3]._cs = cs; tb[3].replaceChildren('로그', ...(m.log_errors ? [h('span', { class: 'cnt' }, cs)] : [])); }   // 오류가 있으면 개수를 보여 준다 (바뀔 때만 다시 그린다)
}
function render() { if (!S) return; renderSide(); renderHome(); if (selId) renderModHead(); }

async function refresh() {
  try { S = await api.get_state(); } catch (e) { return; }
  render();
  if (selId && tab === 'window') maybeReloadFrame();
  if (selId && tab === 'log') pollLog();
}

// ---- 켜고 끄기 ----
$('bigToggle').addEventListener('click', async () => {
  if (busy || !S) return;
  busy = true; const want = !S.running;
  $('bigToggle').className = 'big-toggle ' + (want ? 'wait' : '');
  $('stTitle').textContent = want ? '켜는 중' : '끄는 중'; $('stDesc').textContent = '잠시만요';
  try { await api.toggle(want); } finally { busy = false; refresh(); }
});
async function setEnabled(id, on) {
  const r = await api.set_mod_enabled(id, on);
  if (!r.ok) toast(r.error); else toast(on ? '모드를 켰어요' : '모드를 껐어요');
  await refresh();
  loaded.tab = null; if (selId === id) showTab(tab, true);
}
$('mSwitch').addEventListener('change', () => setEnabled(selId, $('mSwitch').checked));
$('btnInstall').addEventListener('click', async () => {
  const r = await api.pick_and_install();
  if (r.cancelled) return;
  for (const x of (r.results || [r])) {
    if (x.ok) { toast((x.replaced ? '업데이트했어요: ' : '설치했어요: ') + x.name + ' v' + x.version + (x.restart_needed ? ' (Python 부분은 앱을 다시 켜면 적용돼요)' : '')); await refresh(); select(x.id); }
    else if (x.report) { showInstallFail(x); }
    else toast(x.error || '설치하지 못했어요');
  }
});
function showInstallFail(x) {
  const box = $('installFail');
  box.replaceChildren(h('div', { class: 'alert act' }, h('span', {}, (x.file || '') + ': ' + x.error), h('button', { class: 'btn', onclick: () => copyText(x.report, '검사 결과를 복사했어요. AI에게 붙여 넣어 고치게 하세요') }, '검사 결과 복사')));
  select('');
}
async function uninstall(m) {
  const r = await api.uninstall_mod(m.id);
  if (r.ok) { toast('삭제했어요 (파일은 휴지통 폴더로 옮겼어요)'); if (selId === m.id) select(''); } else toast(r.error || '삭제하지 못했어요');
  await refresh();
}
$('btnFolder').addEventListener('click', () => api.open_mods_folder());
$('btnRescan').addEventListener('click', async () => { await api.rescan(); await refresh(); toast('모드 목록을 다시 읽었어요'); });

// ---- 탭 ----
document.querySelectorAll('#mTabs button').forEach((b) => b.addEventListener('click', () => { if (!b.disabled) showTab(b.dataset.t); }));
async function showTab(t, force) {
  const m = modOf(selId); if (!m) return;
  if (t === 'settings' && !m.has_settings) t = defaultTab(m);
  if (t === 'window' && !m.ui) t = defaultTab(m);
  if (tab !== t || loaded.id !== selId) document.querySelector('.main').scrollTop = 0;
  tab = t;
  document.querySelectorAll('#mTabs button').forEach((b) => b.classList.toggle('sel', b.dataset.t === t));
  ['info', 'settings', 'window', 'log'].forEach((x) => { $('tab-' + x).style.display = x === t ? 'block' : 'none'; });
  if (!force && loaded.id === selId && loaded.tab === t) return;
  loaded = { id: selId, tab: t };
  curMod = await api.get_mod(selId);
  if (!curMod || selId !== curMod.id) return;
  if (t === 'info') buildInfo(curMod); else if (t === 'settings') buildSettings(curMod); else if (t === 'log') buildLog(curMod); else buildWindow(curMod);
}

// ---- 로그 탭: 모드마다 최근 기록 (JS, Python, 로더). 1초마다 새 항목만 받아 온다 ----
let logSt = { id: null, last: 0, errOnly: false, n: 0 };
function copyText(text, okMsg) {
  const done = () => toast(okMsg);
  const fallback = () => { const ta = h('textarea', { style: 'position:fixed;left:-9999px' }); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('복사하지 못했어요'); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
function logRow(e) {
  const tag = { js: 'JS', python: 'PY', loader: '로더' }[e.src] || e.src;
  return h('div', { class: 'lg ' + e.lvl, 'data-lvl': e.lvl }, h('span', { class: 't' }, e.t), h('span', { class: 's ' + e.src }, tag), h('span', { class: 'm' }, e.msg));
}
function buildLog(m) {
  logSt = { id: m.id, last: 0, errOnly: false, n: 0 };
  const box = h('div', { class: 'logbox', id: 'logbox' }, h('div', { class: 'empty' }, '아직 기록이 없어요'));
  const seg = h('div', { class: 'seg' });
  [['all', '전체'], ['err', '오류만']].forEach(([k, label]) => {
    const b = h('button', { class: k === 'all' ? 'sel' : '' }, label);
    b.addEventListener('click', () => { logSt.errOnly = k === 'err'; seg.querySelectorAll('button').forEach((x) => x.classList.toggle('sel', x === b)); applyLogFilter(); });
    seg.append(b);
  });
  const tools = h('div', { class: 'logtools' }, seg, h('span', { class: 'sp' }),
    h('button', { class: 'btn primary', title: '상태, 검사 결과, 최근 로그를 한 번에 복사해요. AI에게 붙여 넣고 "원인을 찾아 고쳐 줘"라고 하세요', onclick: async () => copyText(await api.get_mod_report(m.id), 'AI에게 줄 보고서를 복사했어요') }, 'AI에게 줄 보고서 복사'),
    h('button', { class: 'btn grey', onclick: async () => copyText(await api.get_mod_log_text(m.id), '로그를 복사했어요') }, '로그 복사'),
    h('button', { class: 'btn grey', onclick: async () => { await api.clear_mod_log(m.id); buildLog(m); } }, '지우기'));
  $('tab-log').replaceChildren(tools, box, h('div', { class: 'foot' }, '앱을 켠 뒤의 기록이에요. 전체 기록은 loader.log에 있어요'));
  pollLog();
}
function applyLogFilter() { document.querySelectorAll('#logbox .lg').forEach((r) => { r.style.display = logSt.errOnly && r.dataset.lvl !== 'error' ? 'none' : ''; }); }
async function pollLog() {
  if (tab !== 'log' || !logSt.id || logSt.id !== selId) return;
  const box = $('logbox'); if (!box) return;
  let r; try { r = await api.get_mod_log(logSt.id, logSt.last); } catch (e) { return; }
  if (logSt.id !== selId || !r.entries.length) return;
  const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  if (!logSt.n) box.replaceChildren();
  r.entries.forEach((e) => box.append(logRow(e)));
  logSt.n += r.entries.length; logSt.last = r.last;
  while (box.children.length > 500) box.removeChild(box.firstChild);
  applyLogFilter();
  if (atEnd || logSt.n === r.entries.length) box.scrollTop = box.scrollHeight;
}

// ---- 정보 탭 ----
function buildInfo(m) {
  const row = (n, v) => h('div', { class: 'row' }, h('div', { class: 'name' }, n), h('div', { class: 'val' }, v || '-'));
  const out = [h('div', { class: 'card list' },
    row('버전', m.version), row('작성자', m.author), row('라이선스', m.license), row('필요한 코어', m.core || '제한 없음'),
    row('형식', m.kind === 'file' ? '.24mod 파일' : '개발 폴더'), row('위치', m.path), row('데이터 폴더', m.data_dir))];
  m.problems.forEach((p) => out.push(h('div', { class: 'alert' }, p)));
  if (m.needs_perm.length) {
    const need = m.caps.filter((c) => m.needs_perm.includes(c.name));
    out.push(h('div', { class: 'perm-card' }, h('b', {}, '이 모드는 아래 권한이 필요해요'),
      need.map((c) => h('div', {}, '· ' + c.risk_label + ': ' + c.title + ' - ' + c.desc)),
      h('div', { style: 'margin-top:6px;color:var(--text2);font-size:13px' }, '믿을 수 있는 모드만 허용하세요. 허용하면 바로 켜져요'),
      h('button', { class: 'btn', onclick: async () => { await api.grant_permissions(m.id); toast('권한을 허용하고 켰어요'); await refresh(); loaded.tab = null; showTab('info', true); } }, '허용하고 켜기')));
  }
  if (m.caps.length) {
    out.push(h('div', { class: 'group-title' }, '쓰는 기능' + (m.caps_declared ? '' : ' (mod.json에 선언 없음, 코드에서 찾음)')));
    out.push(h('div', { class: 'card list caps' }, m.caps.map((c) => h('div', { class: 'row', title: c.name },
      h('div', { class: 'l' }, h('div', { class: 'name' }, c.title), h('div', { class: 'hint' }, c.name + ' · ' + c.desc)),
      h('span', { class: 'tag ' + c.risk + (c.granted ? '' : ' need') }, c.risk_label + (c.auto ? '' : (c.granted ? ' · 허용됨' : ' · 허용 필요')))))));
  }
  if (m.auto_disabled) out.push(h('div', { class: 'alert act' }, h('span', {}, '오류가 반복돼서 자동으로 껐어요 (' + m.auto_disabled.time + ', ' + (m.auto_disabled.source === 'python' ? 'Python 부분' : '게임 쪽 코드') + '): ' + m.auto_disabled.reason),
    h('button', { class: 'btn', onclick: () => setEnabled(m.id, true) }, '다시 켜기')));
  m.warnings.forEach((p) => out.push(h('div', { class: 'alert amber' }, p)));
  if (m.caps.some((c) => c.risk === 'write')) out.push(writesCard(m));
  out.push(h('button', { class: 'btn grey wide', onclick: () => api.open_mod_data(m.id) }, '데이터 폴더 열기'));
  if ((modOf(m.id) || {}).state === 'running') out.push(h('button', { class: 'btn grey wide', style: 'margin-top:8px', title: '모드 파일(mod.js)을 고친 뒤 누르면 게임을 다시 켜지 않고 바로 적용돼요. 게임 데이터 표는 그대로예요',
    onclick: async () => { const r = await api.reload_mod(m.id); toast(r.ok ? (r.done ? '게임 쪽 부분을 다시 올렸어요' : '바뀐 게 없어요') : r.error); } }, '게임 쪽 다시 올리기 (mod.js 고친 뒤)'));
  if (m.removable) {
    const del = h('button', { class: 'btn danger wide', style: 'margin-top:8px' }, '모드 삭제');
    del.addEventListener('click', () => {
      if (!del._armed) { del._armed = true; del.textContent = '정말 삭제할까요? 한 번 더 누르세요'; setTimeout(() => { del._armed = false; del.textContent = '모드 삭제'; }, 4000); return; }
      uninstall(m);
    });
    out.push(del, h('div', { class: 'foot' }, '파일만 지워요. 설정과 데이터 폴더는 남고, 지운 파일은 휴지통 폴더(~/m24ga_data/trash)에 있어서 되살릴 수 있어요'));
  } else out.push(h('div', { class: 'foot' }, '개발 폴더 모드나 모드 폴더 밖의 모드는 앱에서 지우지 않아요'));
  $('tab-info').replaceChildren(...out);
}

// ---- 게임 값 쓰기 기록 (M14): 쓰기 기능이 있는 모드만 ----
function writesCard(m) {
  const box = h('div', {}, h('div', { class: 'group-title' }, '게임 값 쓰기 기록'), h('div', { class: 'card' }, h('div', { class: 'empty' }, '불러오는 중')));
  api.get_mod_writes(m.id).then((w) => {
    const list = w.here.slice(0, 8).map((r) => h('div', { class: 'row' },
      h('div', { class: 'l' }, h('div', { class: 'name' }, (r.name || r.key) + ': ' + r.from + ' → ' + r.to + (r.undone ? ' (되돌림)' : '')),
        h('div', { class: 'hint' }, r.time + (r.date ? ' · 게임 날짜 ' + r.date : '') + (r.reason ? ' · ' + r.reason : ''))),
      h('span', { class: 'tag' }, r.field)));
    const undo = h('button', { class: 'btn danger wide', style: 'margin-top:10px', disabled: !w.active_count }, '이 세이브에서 이 모드가 바꾼 값 되돌리기 (' + w.active_count + '개)');
    undo.addEventListener('click', async () => {
      if (!undo._armed) { undo._armed = true; undo.textContent = '정말 되돌릴까요? 한 번 더 누르세요'; setTimeout(() => { undo._armed = false; undo.textContent = '이 세이브에서 이 모드가 바꾼 값 되돌리기 (' + w.active_count + '개)'; }, 4000); return; }
      const r = await api.undo_mod_writes(m.id);
      toast(r.ok ? r.done + '개를 되돌렸어요' + (r.skipped.length ? ', ' + r.skipped.length + '개는 지금 값이 달라서 건너뛰었어요' : '') : r.error);
      loaded.tab = null; showTab('info', true);
    });
    box.replaceChildren(h('div', { class: 'group-title' }, '게임 값 쓰기 기록'),
      h('div', { class: 'card list caps' }, list.length ? list : [h('div', { class: 'empty' }, w.save ? '이 세이브에서 바꾼 값이 없어요' : '세이브를 불러오면 보여요')]),
      undo,
      h('div', { class: 'foot' }, '이 세이브에서 ' + w.here_count + '번 바꿨어요 (전체 ' + w.total + '번, ~/m24ga_data/writes.jsonl). 게임을 저장하면 바꾼 값이 세이브 파일에 남아요. 되돌린 뒤에는 다시 저장하세요. 중요한 세이브는 미리 복사해 두세요'));
  });
  return box;
}

// ---- 설정 탭 (mod.json settings로 자동 생성) ----
function buildSettings(m) {
  const { specs, values, set } = m.settings;
  const groups = []; const byName = {};
  specs.forEach((s) => { const g = s.group || '설정'; if (!byName[g]) { byName[g] = []; groups.push(g); } byName[g].push(s); });
  const out = [];
  groups.forEach((g) => {
    out.push(h('div', { class: 'group-title' }, g));
    out.push(h('div', { class: 'card list' }, byName[g].map((s) => settingRow(m.id, s, values[s.key], set[s.key]))));
  });
  if (!specs.length) out.push(h('div', { class: 'empty' }, '이 모드는 설정이 없어요'));
  out.push(h('div', { class: 'foot' }, '바꾸면 바로 저장돼요'));
  $('tab-settings').replaceChildren(...out);
}
async function save(id, key, val, msg) {
  const r = await api.save_mod_settings(id, { [key]: val });
  if (r.ok) toast(msg || '저장했어요');
  else { toast(Object.values(r.errors)[0] || '저장하지 못했어요'); loaded.tab = null; showTab('settings', true); }
}
function settingRow(id, s, val, isSet) {
  const lab = (extra) => h('div', { class: 'l' }, h('div', { class: 'name' }, s.label || s.key, extra), s.help ? h('div', { class: 'hint' }, s.help) : null);
  const t = s.type;
  if (t === 'bool') {
    const i = h('input', { type: 'checkbox', checked: !!val }); i.addEventListener('change', () => save(id, s.key, i.checked));
    return h('div', { class: 'row' }, lab(), h('label', { class: 'switch' }, i, h('span')));
  }
  if (t === 'select') {
    const opts = s.options || [];
    if (opts.length <= 4) {
      const seg = h('div', { class: 'seg' }, opts.map((o) => { const b = h('button', { class: o.value === val ? 'sel' : '' }, o.label); b.addEventListener('click', () => { seg.querySelectorAll('button').forEach((x) => x.classList.toggle('sel', x === b)); save(id, s.key, o.value); }); return b; }));
      return h('div', { class: 'row col' }, lab(), seg);
    }
    const sel = h('select', {}, opts.map((o) => h('option', { value: o.value, selected: o.value === val }, o.label))); sel.addEventListener('change', () => save(id, s.key, sel.value));
    return h('div', { class: 'row' }, lab(), h('div', { class: 'field', style: 'margin:0;flex:none;width:180px' }, sel));
  }
  if ((t === 'number' || t === 'int') && s.min != null && s.max != null && t === 'number') {   // 범위가 있는 실수 = 슬라이더
    const pct = !!s.percent, k = pct ? 100 : 1;
    const out = h('span', { class: 'rng-val' }, fmt(val * k, pct));
    const r = h('input', { type: 'range', min: s.min * k, max: s.max * k, step: pct ? 5 : (s.step || (s.max - s.min) / 100), value: val * k });
    r.addEventListener('input', () => { out.textContent = ' ' + fmt(r.value, pct); });
    r.addEventListener('change', () => save(id, s.key, +r.value / k));
    out.textContent = ' ' + fmt(val * k, pct);
    return h('div', { class: 'row col' }, h('div', { class: 'l' }, h('div', { class: 'name' }, s.label || s.key, out), s.help ? h('div', { class: 'hint' }, s.help) : null), r);
  }
  if (t === 'number' || t === 'int') {
    const i = h('input', { class: 'num', type: 'number', value: val, min: s.min, max: s.max, step: t === 'int' ? 1 : 'any' });
    i.addEventListener('change', () => { const n = t === 'int' ? parseInt(i.value, 10) : parseFloat(i.value); if (!isNaN(n)) save(id, s.key, n); });
    return h('div', { class: 'row' }, lab(), h('div', { class: 'field', style: 'margin:0;flex:none' }, i));
  }
  if (t === 'text' && s.multiline) {
    const ta = h('textarea', { placeholder: s.placeholder || '', spellcheck: 'false' }); ta.value = val || '';
    ta.addEventListener('change', () => save(id, s.key, ta.value));
    return h('div', { class: 'row col' }, lab(), ta);
  }
  const pw = t === 'password';
  const i = h('input', { type: pw ? 'password' : 'text', placeholder: pw ? (isSet ? '저장돼 있어요 · 바꾸려면 새 값을 넣어 주세요' : (s.placeholder || '')) : (s.placeholder || ''), autocomplete: 'off', spellcheck: 'false' });
  i.value = pw ? '' : (val || '');
  i.addEventListener('change', () => { if (pw && !i.value) return; save(id, s.key, i.value); if (pw) i.value = ''; });
  return h('div', { class: 'row col' }, lab(), h('div', { class: 'field' }, i));
}
function fmt(v, pct) { return pct ? Math.round(v) + '%' : String(Math.round(v * 100) / 100); }

// ---- 모드창 탭 (sandbox iframe) ----
function buildWindow(m) {
  const box = $('tab-window'); frameId = null;
  const st = (modOf(m.id) || {}).state || m.state;
  if (['off', 'problem', 'auto_off', 'safe', 'perm'].includes(st)) {
    const why = { off: '모드가 꺼져 있어요', problem: '켤 수 없는 모드예요', auto_off: '오류가 반복돼서 자동으로 꺼졌어요', safe: '안전 모드라서 아직 올리지 않았어요', perm: '권한을 허용해야 켜져요 (정보 탭)' }[st];
    box.replaceChildren(h('div', { class: 'card' }, h('div', { class: 'empty' }, why, h('br'), st === 'problem' || st === 'perm' ? '정보 탭에서 확인해 주세요' : '오른쪽 위 스위치로 켜 주세요')));
    loaded.python = false; return;
  }
  if (!m.python_running) { box.replaceChildren(h('div', { class: 'card' }, h('div', { class: 'empty' }, '모드가 아직 실행 중이 아니에요', h('br'), '홈에서 M24GA를 켜면 이 창이 열려요'))); loaded.python = false; return; }
  loaded.python = true;
  api.get_mod_ui(m.id).then((html) => {
    if (selId !== m.id || tab !== 'window') return;
    if (!html) { box.replaceChildren(h('div', { class: 'card' }, h('div', { class: 'empty' }, '이 모드는 모드창이 없어요'))); return; }
    const f = h('iframe', { class: 'frame', sandbox: 'allow-scripts' });
    f.srcdoc = html; box.replaceChildren(f); frameId = m.id;
  });
}
function maybeReloadFrame() {   // 로더를 켜서 Python이 뜬 순간, 또는 모드를 켜고 끈 순간에 모드창을 다시 만든다
  const m = modOf(selId); if (!m || !m.ui) return;
  const want = m.python_running && m.state !== 'off';
  if (want !== !!loaded.python) { loaded.python = want; buildWindow(m); }
}
window.addEventListener('message', async (e) => {
  const f = document.querySelector('#tab-window iframe');
  if (!f || e.source !== f.contentWindow || !e.data || !e.data.m24) return;
  const d = e.data;
  if (d.toast) { toast(d.toast); return; }
  let r;
  try { r = await api.mod_call(frameId, String(d.name), d.args || []); } catch (x) { r = { ok: false, error: String(x) }; }
  f.contentWindow.postMessage({ m24: 1, id: d.id, ok: r.ok, result: r.result, error: r.error }, '*');
});

// ---- 시작 ----
window.addEventListener('pywebviewready', async () => {
  api = window.pywebview.api;
  await refresh(); select('');
  setInterval(refresh, 1000);
});
</script>
