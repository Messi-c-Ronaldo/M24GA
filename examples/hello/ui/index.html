<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Hello 예제</title></head>
<body>
<!-- 모드창: sandbox iframe 안에서 돈다. 로더가 테마 CSS(.card .stat .btn .field ...)와 m24.call / m24.toast를 앞에 넣어 준다. -->
<div class="stats">
  <div class="stat"><div class="label">Python 틱</div><div class="value" id="vTicks">0</div></div>
  <div class="stat"><div class="label">켜진 지 (초)</div><div class="value" id="vUp">0</div></div>
  <div class="stat"><div class="label">기분</div><div class="value" id="vMood">-</div></div>
</div>
<div class="card">
  <div class="sec-title"><b>인사 만들기</b></div>
  <div class="field">
    <input id="name" placeholder="이름" autocomplete="off" spellcheck="false">
    <button class="btn primary" id="go">인사</button>
  </div>
  <p id="out" style="font-size:18px;font-weight:600;margin:16px 4px 0;user-select:text"></p>
</div>
<script>
const $ = (id) => document.getElementById(id);
async function tick() {
  try { const s = await m24.call('state'); $('vTicks').textContent = s.ticks; $('vUp').textContent = s.up; $('vMood').textContent = Math.round(s.mood * 100) + '%'; } catch (e) {}
}
$('go').addEventListener('click', async () => {
  try { $('out').textContent = await m24.call('greet', $('name').value); }   // 글자는 textContent로만 넣는다
  catch (e) { m24.toast(e.message); }
});
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
